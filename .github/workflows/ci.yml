name: CI

on:
  push:
    branches: [main, windows-port]
    paths:
      - "*.py"
      - "tests/**"
      - "packaging/**"
      - "pytest.ini"
      - "requirements-ci.txt"
      - "requirements-windows.txt"
      - ".github/**"
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "packaging/**"
      - "pytest.ini"
      - "requirements-ci.txt"
      - "requirements-windows.txt"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ID: io.github.patsinclair1.ScreenshotMarkup
  MANIFEST: packaging/flatpak/io.github.patsinclair1.ScreenshotMarkup.yml
  # Set to "1" (repo variable LINT_STRICT) once patsinclair1 is replaced and the repo is public.
  LINT_STRICT: ${{ vars.LINT_STRICT || '0' }}

jobs:
  flatpak:
    name: Flatpak (GNOME 50)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # The old bilelmoussaoui/flatpak-github-actions images moved to flathub-infra.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: screenshot-markup.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: true
          # Mirror metainfo screenshots into the repo like Flathub's builders do
          mirror-screenshots-url: https://dl.flathub.org/media
      - name: Lint manifest
        run: bash .github/scripts/flatpak-lint.sh manifest "$MANIFEST"
      - name: Lint repo
        run: bash .github/scripts/flatpak-lint.sh repo repo

  linux-native:
    name: Linux native (Ubuntu 24.04, GTK 4.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        # Distro PyGObject so gi matches the system GTK (Ubuntu 24.04 ships GTK 4.14 / 3.24;
        # bazzite and GNOME 50 are on GTK 4.20+, so newer-only GTK APIs may differ here).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 \
            python3-pytest python3-websocket xvfb xauth appstream desktop-file-utils
      - name: Tests (xvfb)
        run: xvfb-run -a python3 -m pytest -v
      - name: Validate metainfo
        run: appstreamcli validate --no-net --explain "packaging/data/$APP_ID.metainfo.xml"
      - name: Validate desktop file
        run: desktop-file-validate "packaging/data/$APP_ID.desktop"

  windows:
    name: Windows (PySide6 port, PyInstaller exe, screenshots)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-windows.txt
      - name: Install
        run: python -m pip install -r requirements-ci.txt -r requirements-windows.txt pyinstaller pillow
      - name: Tests (GTK tests skip; core + Qt run)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: Windows OCR probe (Windows.Media.Ocr, advisory)
        continue-on-error: true
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import markup_qt as m, tempfile, os; from PySide6.QtWidgets import QApplication; a=QApplication([]); p=m.make_demo_image(os.path.join(tempfile.gettempdir(),'ocr.png')); r=m.ocr_winrt(p); print(len(r['words']),'words', r['links'])"
      - name: Build exe
        run: ./packaging/windows/build.ps1
      - name: Screenshot from the built exe (real desktop session)
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:QT_QPA_PLATFORM = "windows"
          $p = Start-Process dist\ScreenshotMarkup.exe -ArgumentList "--capture-demo", "$PWD\shots\markup-windows.png" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path shots\markup-windows.png)) { throw "capture failed ($($p.ExitCode))" }
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotMarkup-windows-exe
          path: dist/ScreenshotMarkup.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotMarkup-windows-screenshots
          path: shots/
          retention-days: 14

  macos:
    name: macOS (Qt build, mock backend, screenshots)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-windows.txt
      - run: python -m pip install -r requirements-ci.txt -r requirements-windows.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: Screenshots (cocoa, QWidget.grab + screencapture)
        run: |
          mkdir -p shots
          python markup_qt.py --capture-demo shots/markup-macos.png
          screencapture -x shots/markup-macos-desktop.png || echo "screencapture not permitted on this runner"
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotMarkup-macos-screenshots
          path: shots/
          retention-days: 14
