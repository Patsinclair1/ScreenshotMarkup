[pytest]
testpaths = tests
# test_export.py is a standalone script (runs at import); it is wrapped by test_export_wayland.py
addopts = -ra --ignore=tests/test_export.py
markers =
    qt: requires PySide6 (Windows/macOS front end)
    gtk: requires PyGObject with GTK 4 (Linux)
    wayland: requires a live Wayland GNOME session (clipboard via wl-paste)
    ocr: requires the tesseract binary
